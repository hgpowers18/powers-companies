hero:
  eyebrow: "MARYLAND · PENNSYLVANIA"
  title_lead: "We've built homes, neighborhoods, and the spaces"
  title_emphasis: "in between."
  body: "For more than four decades, the Powers Brothers have been raising the standard of building across Maryland and Pennsylvania."
  video:
    poster: /uploads/hero-poster.jpg
    desktop: /uploads/powers-hero-background-v3.mp4
    mobile: /uploads/powers-hero-background-v3-mobile.mp4
  audio:
