    features:
      - title: Custom & semi-custom
        body: Bring us your plans or build on ours.
      - title: Homesites
        body: One to three-plus acres, most of them wooded and private.
      - title: Where we build
        body: Eldersburg, Sykesville, Manchester, Reisterstown, Woodstock, Essex.
      - title: Standard, not extra
        body: Energy Star certification, concealed sprinklers, maple kitchens.
  - id: commercial
    aria_label: Commercial and Office
    label: 02 — COMMERCIAL & OFFICE
    title: Office, retail, industrial. We've done it all.
    paragraphs:
      - Office space, retail centers, industrial parks — we'll take any parcel of land and turn it into the business space you envisioned. Cutting-edge, attractive, and delivered on budget.
      - The West Branch Trade Center runs to 40,000 square feet on Tech Court in Westminster. A shrub-covered lot on Sykesville Road became the 26,500 square foot Westminster branch of the Y of Central Maryland. The Professional Center at 795 leased out in full, with Carroll Hospital Center at the front of it, and a second building followed.
      - Across the Pennsylvania line we built the Jefferson Codorus Joint Sewer Authority a treatment plant that handles 240,000 gallons a day for two townships. The range runs from a suite of consulting rooms to public infrastructure, and the same team sees each of them through.
    image: /uploads/image_8c751d14.jpg
    image_alt: Baltimore Inner Harbor at sunset
    note_label: Selected projects
    note_items:
      - name: West Branch Trade Center
        where: Westminster · 40,000 sq ft
      - name: The Professional Center at 795
        where: Reisterstown · 16,000 sq ft
      - name: The Professional Center II at 795
        where: Reisterstown · 20,000 sq ft
      - name: Y of Central Maryland
        where: Westminster · 26,500 sq ft
      - name: 22 West Pennsylvania Avenue
        where: Towson · 37,500 sq ft
      - name: Eldersburg Self Storage Park
        where: Eldersburg
      - name: Jefferson Codorus Joint Sewer Authority
        where: Codorus, PA · 240,000 gal a day
    show_developments_list: false
    features:
