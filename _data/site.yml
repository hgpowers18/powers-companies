  - value: "2,500"
    suffix: "+"
    label: Homes built
  - value: "35"
    suffix: "+"
    label: Years building
  - value: "5,000"
    suffix: "+"
    label: HOMESITES DEVELOPED

ethos:
  eyebrow: Our approach
  lead_text: "We started with homes. Then neighborhoods. Then office buildings and industrial parks. Through all of it, one thing never changed — our"
  lead_emphasis: "relentless attention to detail."
  paragraphs:
    - "With extensive knowledge of building and a demonstrated commitment to our customers, we deliver quality products and superlative craftsmanship on every project we touch."
    - "We build commercial spaces and residential homes that are cutting edge and attractive — and we'll astound you with our creative use of space, style, and design."

divisions_intro:
  eyebrow: What we build
  title_line_1: "Four divisions."
  title_line_2: "One standard."
  body: "Everything from a single custom home to a full industrial park — under one roof, with one team accountable end to end."

divisions:
  - id: homes
    aria_label: Developments
    image: /uploads/image_f874027c.jpg
    image_alt: Aerial view of a residential development
    label: "01 — DEVELOPMENTS"
    title: Developments copy goes here and here
    body: "THE DEVS WILL GET LISTED HERE: With more than two decades in the new homes business, we've got the expertise to build your dream home across the greater Baltimore area — on schedule and on budget."
    show_developments_list: true
    features:
      - title: "Custom & semi-custom"
        body: Bring us your plans or build on ours.
      - title: Neighborhoods
        body: We develop the communities, not just the houses.
  - id: commercial
    aria_label: Commercial and Office
    image: /uploads/image_8c751d14.jpg
    image_alt: Baltimore Inner Harbor at sunset
    label: "02 — COMMERCIAL & OFFICE"
    title: Office, retail, industrial. We've done it all.
    body: "Office space, retail centers, industrial parks — we'll take any parcel of land and turn it into the business space you envisioned. Cutting-edge, attractive, and delivered on budget."
    show_developments_list: false
    features:
      - title: "Office & retail"
        body: Spaces designed around how your business runs.
      - title: Industrial parks
        body: Large-scale development, managed end to end.

