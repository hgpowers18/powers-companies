ethos:
  eyebrow: Our approach
  lead_text: We started with homes. Then neighborhoods. Then office buildings and industrial parks. Through all of it, one thing never changed — our
  lead_emphasis: relentless attention to detail.
  paragraphs:
    - With extensive knowledge of building and a demonstrated commitment to our customers, we deliver quality products and superlative craftsmanship on every project we touch.
    - We build commercial spaces and residential homes that are cutting edge and attractive — and we'll astound you with our creative use of space, style, and design.
divisions_intro:
  eyebrow: What we build
  title_line_1: Many divisions.
  title_line_2: One standard.
  body: Everything from a custom single family home to a full industrial park, large scale single and multifamily development, to commercial and office construction. We are diverse but we don't lose sight of the attention to detail — under one roof, one team.
divisions:
  - id: homes
    aria_label: Developments
    label: 01 — DEVELOPMENTS
    title: The land, then the homes.
    paragraphs:
      - Every great community starts as an open field, our field of dreams. We turn that land into opportunities where builders can build and families can thrive and grow. We're involved at every step.
      - We look for farms and large parcels with strong potential and purpose. Good access to roads and utilities, favorable topography, and a location where people want to live. Before that, we study zoning, soil conditions, schools, and market demand to make sure every property meets with our strict scrutiny. Planning amenities like walking trails, parks and playgrounds, open green space, ponds, pavilions, pools, clubhouses, and gathering areas. Each is chosen to fit the neighborhood and the people who will live there.
    image: /uploads/image_f874027c.jpg
    image_alt: Aerial view of a residential development
    list_eyebrow: Our communities
    note_label: ''
    note: ''
    show_developments_list: true
    development_types:
      - Single-family
      - Multifamily
    features: []
  - id: commercial
    aria_label: Commercial, Office, & Manufacturing
    label: 02 — COMMERCIAL, OFFICE & MANUFACTURING
    title: Office, retail, industrial, & manufacturing. We've done it all.
    paragraphs:
      - We develop office, retail, industrial and manufacturing properties from the ground up, handling everything from site acquisition and financing to entitlements, design and construction.
      - We build projects that fit how tenants operate and hold their value over time.
    image: /uploads/usdj01rlsngjso4m2da0.avif
    image_alt: Baltimore Inner Harbor at sunset
