ethos:
  eyebrow: Our approach
  lead_text: We started with homes. Then neighborhoods. Then office buildings and industrial parks. Through all of it, one thing never changed — our
  lead_emphasis: relentless attention to detail.
  paragraphs:
    - With extensive knowledge of building and a demonstrated commitment to our customers, we deliver quality products and superlative craftsmanship on every project we touch.
    - We build commercial spaces and residential homes that are cutting edge and attractive — and we'll astound you with our creative use of space, style, and design.
divisions_intro:
  eyebrow: What we build
  title_line_1: Two divisions.
  title_line_2: One standard.
  body: Everything from a single custom home to a full industrial park — under one roof, with one team accountable end to end.
divisions:
  - id: homes
    aria_label: Developments
    label: 01 — DEVELOPMENTS
    title: Communities that sell out.
    paragraphs:
      - Three-acre lots backing onto Liberty Reservoir, wooded homesites in Woodstock, waterfront villas in Essex. We buy the land, lay out the homesites and build the homes that go on them — and almost every community we have opened is now sold out.
      - "Every plan in the portfolio can be built as drawn or reworked around the way your family actually lives, and the specification starts where other builders stop — maple kitchens with staggered cabinetry, motion-sensor lighting in the owner's closet, concealed sprinkler heads, Energy Star certification."
      - The brothers who choose the land are the same people walking the site while the drywall goes up — which is how a community of twenty-three homes still gets the attention of a one-off custom build.
    image: /uploads/image_f874027c.jpg
    image_alt: Aerial view of a residential development
    list_eyebrow: Our communities
